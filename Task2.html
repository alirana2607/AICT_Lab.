```html
<html>
<head>
    <title>Age Calculator</title>
</head>
<body>

<h2>Age Calculator</h2>

<button onclick="age()">Calculate Age</button>

<p id="result"></p>

<script>

function age()
{
    var birthYear = prompt("Enter your Birth Year");

    var myAge = 2026 - birthYear;

    document.getElementById("result").innerHTML =
    "Your Age is: " + myAge;
}

</script>

</body>
</html>
```
